name: Publish to npm

# A plain semver tag ("1.2.3", no "v") releases that version. The package is
# published with npm Trusted Publishing: npm trusts this workflow via OIDC,
# so no token is stored in the repository, and every release carries a
# provenance attestation.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@latest
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run prepublishOnly
      - run: npm publish --provenance --access public
